
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center py-4">
        <div class="container">
            <h1>Student Results Management System</h1>
            <p class="mb-0">Manage Student Grades and Results Easily</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container py-5">

        <!-- Add Student Form -->
        <div class="card shadow p-4 mb-4">

            <h3 class="mb-3">Add New Student</h3>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" id="studentName" class="form-control"
                    placeholder="Enter student name">
            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Subject 1</label>
                    <input type="number" id="grade1" class="form-control"
                        placeholder="Enter grade">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Subject 2</label>
                    <input type="number" id="grade2" class="form-control"
                        placeholder="Enter grade">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Subject 3</label>
                    <input type="number" id="grade3" class="form-control"
                        placeholder="Enter grade">
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Attendance Percentage</label>
                <input type="number" id="attendance" class="form-control"
                    placeholder="Enter attendance percentage">
            </div>

            <button id="addStudentBtn" class="btn btn-primary w-100">
                Add Student
            </button>

        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <!-- Students List -->
        <div class="card shadow p-4 mb-4">

            <h3 class="mb-3">Students List</h3>

            <div id="studentsDisplay">
                <p class="text-muted">No students added yet.</p>
            </div>

        </div>

        <!-- Mercy Committee -->
        <div class="text-center mb-4">
            <button id="mercyBtn" class="btn btn-success">
                Activate Mercy Committee
            </button>
        </div>

        <!-- Final Report -->
        <div class="card shadow p-4 mb-4">

            <h3 class="mb-3">Final Report</h3>

            <div id="finalReport">
                <p class="text-muted">The report will appear here.</p>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">

        <p class="mb-1">Student Results Management System</p>

        <p class="mb-0">
            © 2026 All Rights Reserved | Developed by Mariam
        </p>

    </footer>

    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>
</html>
